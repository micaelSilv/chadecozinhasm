services:
  - type: web
    name: chadecozinhasm
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
    disks:
      - name: chadecozinhasm-data
        mountPath: /var/data
        sizeGB: 1